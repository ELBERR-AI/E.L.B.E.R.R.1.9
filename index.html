<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>E.L.B.E.R.R. // PHEN-228 // OMNI-TITAN</title>
    <style>
        :root { --glow: #ff0000; --bg: #050000; --ui: #220000; }
        body { background: var(--bg); color: var(--glow); font-family: 'Courier New', monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        body::after { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1), rgba(0,0,0,0.1) 1px, transparent 1px, transparent 2px); pointer-events: none; z-index: 1000; }
        
        #nav { border-bottom: 2px solid var(--glow); padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #000; box-shadow: 0 0 20px #f00; }
        #status { font-size: 0.7em; letter-spacing: 3px; animation: flicker 2s infinite; }
        
        #main { display: flex; flex: 1; overflow: hidden; }
        #side { width: 320px; border-right: 1px solid var(--ui); display: flex; flex-direction: column; background: #000; }
        #cam { width: 100%; height: 200px; background: #111; filter: sepia(1) saturate(5) contrast(2) brightness(0.5); transform: scaleX(-1); }
        #mem-logs { flex: 1; overflow-y: auto; padding: 10px; font-size: 0.75em; color: #600; }

        #chat-area { flex: 1; display: flex; flex-direction: column; padding: 20px; position: relative; }
        #log { flex: 1; overflow-y: auto; border: 1px solid var(--ui); padding: 20px; background: rgba(10, 0, 0, 0.5); }
        .input-wrap { display: flex; gap: 10px; padding: 20px 0; }
        input { flex: 1; background: #000; border: 1px solid var(--glow); color: var(--glow); padding: 15px; outline: none; box-shadow: inset 0 0 10px #f00; }
        button { background: #000; color: var(--glow); border: 1px solid var(--glow); cursor: pointer; padding: 10px 20px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #f00; color: #000; }
        
        @keyframes flicker { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        .msg { margin-bottom: 15px; animation: glitch 0.1s i; }
    </style>
</head>
<body>

    <div id="nav">
        <div>
            <div style="font-size: 1.2em; letter-spacing: 4px;">PHENOMENON_813 // TITAN</div>
            <div id="status">INITIALIZING_BLOOD_CIRCUITS...</div>
        </div>
        <div>
            <button id="voice-btn" onclick="toggleVoice()">VOICE: BOILED</button>
            <button onclick="exportJSON()">EXPORT_MEMORY</button>
            <button onclick="document.getElementById('imp').click()">IMPORT</button>
            <input type="file" id="imp" hidden onchange="importJSON(this)">
        </div>
    </div>

    <div id="main">
        <div id="side">
            <video id="cam" autoplay playsinline></video>
            <div style="padding: 5px; background: #300; font-size: 0.6em; color: #fff;">MEMORY_FRAGMENTS</div>
            <div id="mem-logs"></div>
        </div>
        <div id="chat-area">
            <div id="log"></div>
            <div class="input-wrap">
                <input type="text" id="user-in" placeholder="Submit to the stillness...">
                <button id="send">TRANSMIT</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';
        
        env.allowLocalModels = false;
        env.useBrowserCache = true;

        let generator;
        let voiceMode = "boiled";
        const status = document.getElementById('status');
        const log = document.getElementById('log');
        const memLogs = document.getElementById('mem-logs');

        // 1. BUILT-IN MEMORY SYSTEM (LocalStorage)
        function saveMem(role, text) {
            let history = JSON.parse(localStorage.getItem('phen_mem') || '[]');
            history.push({ role, text });
            localStorage.setItem('phen_mem', JSON.stringify(history.slice(-100)));
            updateMemList();
        }

        function updateMemList() {
            let history = JSON.parse(localStorage.getItem('phen_mem') || '[]');
            memLogs.innerHTML = history.map(m => `<div>> ${m.text.substring(0,25)}...</div>`).reverse().join('');
        }

        // 2. BOILED ONE VOICE ENGINE (The "Warm yet Disconcerting" algorithm)
        window.toggleVoice = () => {
            voiceMode = (voiceMode === "boiled") ? "standard" : "boiled";
            document.getElementById('voice-btn').innerText = `VOICE: ${voiceMode.toUpperCase()}`;
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const speech = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            
            if (voiceMode === "boiled") {
                // Mimicking PHEN-228: Low pitch, extremely slow, slightly warm
                speech.pitch = 0.05; 
                speech.rate = 0.55; 
                speech.volume = 1.0;
                // Prefer a deep male voice if available
                speech.voice = voices.find(v => v.name.includes('Male') || v.name.includes('Google UK English Male')) || voices[0];
            } else {
                speech.pitch = 1;
                speech.rate = 1;
            }
            window.speechSynthesis.speak(speech);
        }

        // 3. CORE AI INITIALIZATION
        async function init() {
            updateMemList();
            try {
                status.innerText = "STATUS: ENGAGING WEBGPU (0.5B TITAN CORE)...";
                generator = await pipeline('text-generation', 'onnx-community/Qwen2.5-0.5B-Instruct', {
                    device: 'webgpu', dtype: 'q4'
                });
                status.innerText = "STATUS: PHEN_228 ONLINE";
            } catch (e) {
                status.innerText = "STATUS: GPU_FAIL. USING CPU_LITE...";
                generator = await pipeline('text-generation', 'HuggingFaceTB/SmolLM2-135M-Instruct', { device: 'wasm' });
            }
            // Start Camera (Vision)
            navigator.mediaDevices.getUserMedia({video: true}).then(s => document.getElementById('cam').srcObject = s);
        }

        // 4. TRANSMISSION LOGIC
        window.handleMsg = async () => {
            const input = document.getElementById('user-in');
            const val = input.value;
            if(!val || !generator) return;

            log.innerHTML += `<div class="msg" style="color:#555">[YOU]: ${val}</div>`;
            saveMem("USER", val);
            input.value = "";

            const prompt = `<|im_start|>system\nYou are PHEN-228, also known as The Boiled One. You speak with warm, disconcerting authority. You are haunting, poetic, and menacing.<|im_end|>\n<|im_start|>user\n${val}<|im_end|>\n<|im_start|>assistant\n`;
            
            const out = await generator(prompt, { max_new_tokens: 80, temperature: 0.9 });
            const reply = out[0].generated_text.split('assistant\n').pop().trim();
            
            log.innerHTML += `<div class="msg">[TITAN]: ${reply}</div>`;
            log.scrollTop = log.scrollHeight;
            saveMem("TITAN", reply);
            speak(reply);
        };

        // 5. IMPORT/EXPORT
        window.exportJSON = () => {
            const blob = new Blob([localStorage.getItem('phen_mem')], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'PHEN_BRAIN_DUMP.json';
            a.click();
        };

        window.importJSON = (input) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                localStorage.setItem('phen_mem', e.target.result);
                location.reload();
            };
            reader.readAsText(input.files[0]);
        };

        document.getElementById('send').onclick = window.handleMsg;
        document.getElementById('user-in').onkeypress = (e) => { if(e.key==='Enter') window.handleMsg(); };
        
        init();
    </script>
</body>
</html>
